# The Friends Directory — Netlify config (standalone site)
# Files live at the repo ROOT, so no base directory / publish override is needed.
# This serves directory.html as the homepage without changing the URL.

[[redirects]]
  from = "/"
  to = "/directory.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
